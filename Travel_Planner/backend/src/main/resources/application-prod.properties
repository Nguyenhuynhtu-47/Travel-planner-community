# Production Environment Configuration
# Strict security: JWT_SECRET is mandatory with NO fallback to hardcoded keys
jwt.secret=${JWT_SECRET}

# Database credentials must be provided via environment in production
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate production safety: validate schema, do not auto-modify
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Production CORS: explicit origins must be provided via ALLOWED_ORIGINS
cors.allowed-origins=${ALLOWED_ORIGINS:}
cors.allowed-origin-patterns=${ALLOWED_ORIGIN_PATTERNS:}
