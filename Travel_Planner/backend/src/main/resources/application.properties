spring.application.name=Travel_Planner

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/travel_planner?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (read from environment variable, with local fallback)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Server
server.port=8080

# CORS Configuration (comma-separated origins and allowed origin patterns)
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8082,http://127.0.0.1:8082}
cors.allowed-origin-patterns=${ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# Development Seed Data Generation (idempotent, safe for existing records)
app.seed.enabled=${APP_SEED_ENABLED:true}